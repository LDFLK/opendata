<!-- Reports Section -->
<section class="py-10 bg-white relative overflow-hidden">
    <!-- Subtle background elements -->
    <div class="absolute inset-0">
        <div class="absolute top-1/3 left-1/4 w-64 h-64 bg-purple-50 rounded-full filter blur-3xl opacity-40"></div>
        <div class="absolute bottom-1/3 right-1/4 w-72 h-72 bg-indigo-50 rounded-full filter blur-3xl opacity-30"
            style="animation-delay: 2s"></div>
    </div>
    <div class="container mx-auto px-6 md:px-8 max-w-6xl relative z-10">
        <!-- Reports Grid -->
        <div class="mb-16">
            <h3 class="text-2xl font-semibold text-gray-900 mb-8">
                Reports
            </h3>

            <!-- Reports Grid -->
            <div class="grid gap-8 md:grid-cols-2 lg:grid-cols-3" id="reports-grid">
                {% for report in site.reports %}
                <article
                    class="report-card bg-white border border-gray-200 rounded-2xl overflow-hidden hover:border-gray-300 transition-all duration-300 hover:shadow-lg shadow-sm flex flex-col"
                    data-index="{{ forloop.index0 }}">
                    <div class="h-48 bg-gray-100 flex items-center justify-center">
                        {% if report.cover and report.cover != "" %}
                        <img src="{{ report.cover | relative_url }}" alt="{{ report.title }}"
                            class="object-cover h-full w-full" />
                        {% else %}
                        <img src="{{ '/images/logo_design_LDF.png' | relative_url }}" alt="{{ report.title }}"
                            style="width: 150px; height: auto; opacity: 0.5;" class="object-contain" />
                        {% endif %}
                    </div>
                    <div class="p-4 flex-1 flex flex-col">
                        <div class="flex items-center justify-between">
                            <span class="px-2 py-1 bg-green-50 text-green-600 text-xs rounded-full">{{ report.date |
                                date: "%Y-%m-%d" |
                                default: "No Data"
                                }}</span>
                        </div>
                        <h3 class="text-md font-semibold text-gray-900 line-clamp-3 mb-4 mt-2">
                            <a href="{{ report.url | relative_url }}">{{ report.title }}</a>
                        </h3>
                    </div>
                </article>
                {% endfor %}
            </div>

            <!-- Pagination Controls -->
            <nav id="pagination-controls" aria-label="Pagination"
                class="flex items-center justify-center space-x-4 mt-12" style="display: none;">
                <button id="prev-btn" aria-label="Previous page"
                    class="p-2 rounded-md text-gray-600 hover:bg-gray-100 transition-colors disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2"
                    disabled>
                    <i data-lucide="chevron-left" class="h-4 w-4" aria-hidden="true"></i>
                </button>

                <div id="page-numbers" class="flex items-center space-x-2 text-sm">
                    <!-- Page numbers will be dynamically inserted here -->
                </div>

                <button id="next-btn" aria-label="Next page"
                    class="p-2 rounded-md text-gray-600 hover:bg-gray-100 transition-colors disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2">
                    <i data-lucide="chevron-right" class="h-4 w-4" aria-hidden="true"></i>
                </button>
            </nav>

            <!-- Results Info -->
            <div id="results-info" class="text-center mt-8 text-gray-600 text-sm" style="display: none;">
                Showing <span id="showing-start">0</span>-<span id="showing-end">0</span> of <span
                    id="total-reports">0</span>
                reports
            </div>
        </div>

    </div>
</section>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Initialize Lucide icons
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }

        // Pagination functionality
        const reportsPerPage = 6;
        let currentPage = 1;
        let totalReports = 0;
        let totalPages = 0;

        const paginationControls = document.getElementById('pagination-controls');
        const resultsInfo = document.getElementById('results-info');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const pageNumbers = document.getElementById('page-numbers');
        const showingStart = document.getElementById('showing-start');
        const showingEnd = document.getElementById('showing-end');
        const totalReportsEl = document.getElementById('total-reports');

        function initPagination() {
            const reports = document.querySelectorAll('.report-card');
            totalReports = reports.length;
            totalPages = Math.ceil(totalReports / reportsPerPage);

            // Show pagination controls only if there are more than 6 reports
            if (totalReports > reportsPerPage) {
                paginationControls.style.display = 'flex';
                resultsInfo.style.display = 'block';
                totalReportsEl.textContent = totalReports;

                renderPageNumbers();
                showPage(1);

                // Add event listeners
                prevBtn.addEventListener('click', () => {
                    if (currentPage > 1) {
                        showPage(currentPage - 1);
                    }
                });

                nextBtn.addEventListener('click', () => {
                    if (currentPage < totalPages) {
                        showPage(currentPage + 1);
                    }
                });
            } else {
                // Show all reports if 6 or fewer
                reports.forEach(report => {
                    report.style.display = 'flex';
                });
                if (totalReports > 0) {
                    resultsInfo.style.display = 'block';
                    totalReportsEl.textContent = totalReports;
                    showingStart.textContent = '1';
                    showingEnd.textContent = totalReports;
                }
            }
        }

        function showPage(page) {
            currentPage = page;
            const reports = document.querySelectorAll('.report-card');

            // Hide all reports
            reports.forEach(report => {
                report.style.display = 'none';
            });

            // Show reports for current page
            const startIndex = (page - 1) * reportsPerPage;
            const endIndex = Math.min(startIndex + reportsPerPage, totalReports);

            for (let i = startIndex; i < endIndex; i++) {
                if (reports[i]) {
                    reports[i].style.display = 'flex';
                }
            }

            // Update pagination controls
            prevBtn.disabled = page === 1;
            nextBtn.disabled = page === totalPages;

            // Update page number buttons
            updatePageNumbers();

            // Update results info
            showingStart.textContent = startIndex + 1;
            showingEnd.textContent = endIndex;
        }

        function renderPageNumbers() {
            pageNumbers.innerHTML = '';

            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.textContent = i;
                pageBtn.setAttribute('aria-label', `Page ${i}`);

                pageBtn.addEventListener('click', () => {
                    showPage(i);
                });

                pageNumbers.appendChild(pageBtn);
            }
        }

        function updatePageNumbers() {
            const pageButtons = pageNumbers.querySelectorAll('button');
            pageButtons.forEach((btn, index) => {
                const page = index + 1;
                if (page === currentPage) {
                    btn.className = 'w-8 h-8 rounded-md bg-gray-900 text-white transition-colors focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2';
                    btn.setAttribute('aria-current', 'page');
                } else {
                    btn.className = 'w-8 h-8 rounded-md text-gray-600 hover:bg-gray-100 transition-colors focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2';
                    btn.removeAttribute('aria-current');
                }
            });
        }

        // Initialize pagination when DOM is ready
        initPagination();
    });
</script>

<style>
    .report-card {
        transition: opacity 0.3s ease, transform 0.3s ease;
    }
</style>
